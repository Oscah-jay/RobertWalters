<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - RobertWalters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <i class="fas fa-globe-americas"></i>
                    <span>RobertWalters</span>
                </a>
                <h1>Welcome Back</h1>
                <p>Enter your details to continue your journey</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthPageTab('login')">Login</button>
                <button class="auth-tab" onclick="switchAuthPageTab('signup')">Sign Up</button>
            </div>

            <form id="loginPageForm" onsubmit="handleAuthSubmit(event, 'login')">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn btn-primary">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <form id="signupPageForm" onsubmit="handleAuthSubmit(event, 'signup')" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn btn-primary">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="divider"><span>OR CONTINUE WITH</span></div>

            <div class="social-grid">
                <button class="auth-btn btn-secondary">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="auth-btn btn-secondary">
                    <i class="fab fa-linkedin"></i>
                    <span>LinkedIn</span>
                </button>
            </div>
            
            <div style="text-align: center;">
                <a href="index.html" class="back-link">
                    <i class="fas fa-chevron-left"></i>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        function switchAuthPageTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const loginForm = document.getElementById('loginPageForm');
            const signupForm = document.getElementById('signupPageForm');
            
            tabs.forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                tabs[0].classList.add('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }

        function handleAuthSubmit(e, type) {
            e.preventDefault();
            alert(type === 'login' ? 'Logging in...' : 'Creating account...');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
